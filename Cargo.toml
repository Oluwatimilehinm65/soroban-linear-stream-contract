[package]
name = "dripswave-stream"
version = "0.1.0"
edition = "2021"
description = "A linear token-streaming (vesting) contract for Soroban — deposit once, drip continuously."
license = "MIT"
repository = "https://github.com/oluwatimilehinm65/soroban-linear-stream-contract"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true